name: Release to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: CI Verification Gate (ubuntu-latest - x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-unknown-linux-gnu
      - name: Configure Dynamic Library Path
        run: echo "LD_LIBRARY_PATH=${pythonLocation}/lib:$LD_LIBRARY_PATH" >> $GITHUB_ENV
      - name: Cargo Format Check
        run: cargo fmt --all -- --check
      - name: Cargo Clippy Workspace
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Run Cargo Workspace Tests
        run: cargo test --workspace --target x86_64-unknown-linux-gnu
      - name: Verify All 11 Golden Vectors in Rust
        run: cargo test --test golden_vectors -- --nocapture
      - name: Verify Power-Loss & Fuzzing Suite
        run: cargo test --test robustness_fuzz_security -- --nocapture
      - name: Install Python Test Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install maturin pytest numpy xarray zarr "dask[array]"
          pip install --no-build-isolation -e ./python
      - name: Run Python Test Suite
        run: python -m pytest python/tests/ -v

  build-linux:
    name: Build Linux wheels (x86_64-unknown-linux-gnu)
    runs-on: ubuntu-latest
    env:
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          target: x86_64-unknown-linux-gnu
          manylinux: "2_28"
          args: --release --out dist -i python3.10 python3.11 python3.12 python3.13 --compatibility pypi
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-x86_64
          path: python/dist/*.whl

  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          working-directory: python
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: python/dist/*.tar.gz

  pypi-publish:
    name: Publish to PyPI
    needs: [test, build-linux, build-sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: true
